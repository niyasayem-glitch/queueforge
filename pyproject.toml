[project]
name = "queueforge"
version = "0.1.0"
description = "Distributed task queue platform: core/api/monitor/cli/worker"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "monitor", "cli", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]